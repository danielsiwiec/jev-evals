<!doctype html>
<meta charset="utf-8">
<title>Screen-reader-only radios behind labels</title>
<style>
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
           overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  label{display:inline-block;width:90px;height:47px;line-height:47px;
        text-align:center;border:1px solid #888;margin-right:8px;cursor:pointer}
  input:checked + label{background:#cde}
</style>
<body style="margin:0;font:16px system-ui;padding:24px">
<h1>Points filter</h1>
<div style="height:900px">scroll space — the control sits below the fold</div>
<form id="pts">
  <input class="sr-only" type="radio" name="pointsRange" id="p-all" value="ALL" checked>
  <label for="p-all">All</label>
  <input class="sr-only" type="radio" name="pointsRange" id="p-zero" value="ZERO">
  <label for="p-zero">0</label>
  <input class="sr-only" type="radio" name="pointsRange" id="p-one" value="ONE">
  <label for="p-one">0-1</label>
</form>
<script>
  document.getElementById('pts').addEventListener('change', e => {
    document.title = 'POINTS_' + e.target.value;
  });
</script>
