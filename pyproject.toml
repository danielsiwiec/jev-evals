[project]
name = "peregrine"
version = "0.1.0"
description = "Browser-agent evals comparing Jev, Gemini Flash Lite and Luna on the same decision loop"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28.1",
  "litellm>=1.80.9",
  "loguru>=0.7.3",
  "playwright>=1.56.0",
  "pydantic>=2.12.5",
  "python-dotenv>=1.2.2",
  "typesafe-sdk>=0.7.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "eval: browser evals that drive a real browser against live sites",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["peregrine", "evals"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
